services:
  ldap:
    image: dnknth/ldap-demo
    build: demo-ldap
    ports:
      - 127.0.0.1:389:389
    environment:
      DEBUG: stats
    restart: unless-stopped

  ldap-ui:
    image: dnknth/ldap-ui
    build: .
    ports:
      - 127.0.0.1:5000:5000
    depends_on:
      - ldap
    environment:
      LDAP_URL: "${LDAP_URL:-ldap://ldap/}"
      USE_TLS: ${USE_TLS:-}
    restart: unless-stopped
