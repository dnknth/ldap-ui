name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "^12.0.0"
      - name: Build frontend
        run: |
          pnpm audit --prod
          pnpm build
          # `pnpm run test` (not `pnpm test`): pnpm v12 intercepts its own
          # `--reporter` option and would reject vitest's `--reporter=junit`.
          pnpm run test --reporter=junit --outputFile.junit=TEST-vitest-results.xml
      - name: Install uv
        # setup-uv doesn't publish a `v10` major tag, so pin the full version.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"
      - name: Run tests
        run: |
          uv run -w unittest-xml-reporting -m xmlrunner discover -s tests -p '*_test.py'
      - name: Publish test results
        uses: dorny/test-reporter@v3
        with:
          name: Tests
          path: "TEST-*.xml"
          reporter: java-junit
